[package]
name = "bininspect"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Inspect Rust binary dependency provenance and compiler claims"
license = "MIT"
repository = "https://github.com/yoshiii-xyz/bininspect"
keywords = ["binary", "provenance", "rust", "security"]
categories = ["command-line-utilities", "development-tools"]
build = "build.rs"

[dependencies]
auditable = "0.2"
auditable-info = "0.10"
auditable-serde = "0.9"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[build-dependencies]
auditable-build = "0.2"
